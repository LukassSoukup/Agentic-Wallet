spring:
  application:
    name: control-mcp
  ai:
    mcp:
      server:
        name: control-mcp
        version: 0.0.1
        protocol: streamable
        type: sync
        instructions: ""
        capabilities:
          prompt: false
          resource: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: PT30S
server:
  port: ${PORT:8081}
  shutdown: graceful
skeleton:
  mcp:
    backend-url: ${CONTROL_BACKEND_URL}
    connect-timeout: PT2S
    read-timeout: PT10S
  gateway:
    # the connector gateway hosted in this process behind its own listener (T-037 measures it)
    port: ${GATEWAY_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: 1.0
    propagation:
      produce: W3C
      consume: []
  otlp:
    tracing:
      export:
        enabled: ${OTLP_TRACING_ENABLED:false}
