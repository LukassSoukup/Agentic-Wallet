spring:
  application:
    name: demo-shop
server:
  port: ${PORT:8090}
management:
  endpoints:
    web:
      exposure:
        include: health
skeleton:
  processor:
    # SYNTHETIC processor: where authorisations go and the hook budget it waits (ADR-0009 B5: configured, no default).
    hook-responder-url: ${HOOK_RESPONDER_URL}
    hook-timeout: ${HOOK_TIMEOUT:PT2S}
