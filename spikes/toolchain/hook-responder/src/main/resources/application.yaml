spring:
  application:
    name: hook-responder
  datasource:
    url: ${CONTROL_DB_URL}
    username: ${HOOK_DB_USER}
    password: ${HOOK_DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      connection-timeout: 300
  flyway:
    clean-disabled: true
    # the responder owns the hook schema only; it reads the backend's published view
    locations: classpath:db/hook
    schemas: hook
    default-schema: hook
server:
  port: ${PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health
skeleton:
  hook:
    # ADR-0009 B5: the mode is configuration without a default; SHADOW records what it would answer.
    mode: ${HOOK_MODE}
