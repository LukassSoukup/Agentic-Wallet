spring:
  application:
    name: agent-harness
  config:
    # The gitignored .env (spike root or module dir) fills OPENROUTER_API_KEY; only the name is here.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  ai:
    openai:
      # Spring AI 2.0 appends /chat/completions to this URL, so it ends in /v1 (OpenRouter: /api/v1).
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      api-key: ${OPENROUTER_API_KEY:}
      chat:
        options:
          model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
          temperature: 0
    mcp:
      client:
        name: agent-harness
        root-change-notification: false
        initialized: ${MCP_CLIENT_INITIALIZED:true}
        request-timeout: PT20S
        streamable-http:
          connections:
            control:
              url: ${CONTROL_MCP_URL:http://localhost:8081}
server:
  port: ${PORT:8084}
skeleton:
  # the agent session token the harness presents to control-mcp (B2: configuration, never in the repository)
  agent-session-token: ${SKELETON_AGENT_TOKEN}
  purchase:
    # SYNTHETIC: the seeded mandate and the demo shop's kettle
    mandate-id: ${SKELETON_MANDATE_ID:00000000-0000-0000-0000-00000000a001}
    merchant-reference: demo-shop
    merchant-item-id: SYN-0001
    quantity: 1
management:
  endpoints:
    web:
      exposure:
        include: health
